# The compatibility check of Keep on the distributions' own cloud images.
#
# For every name of the matrix tests/compat-guest.sh fetches the image that tests/compat-images.txt
# pins, boots it as a guest in QEMU on the runner and runs tests/compat-check.sh -m in it: keep
# on the kernel and the device-mapper of that distribution, held against its cryptsetup and
# its dmsetup, with memory images. The guest runs under KVM where the runner offers /dev/kvm
# and is emulated otherwise.
#
# A green job is a statement about the kernel and the cryptsetup that its output names and about
# nothing else. The output is kept as an artifact.
#
# It runs when a file changes that the check depends on, and by hand.
name: distributions

on:
  push:
    paths:
      - kcore-keyscan.c
      - src/**
      - Makefile
      - tests/keep-unit.c
      - tests/compat-check.sh
      - tests/compat-guest.sh
      - tests/compat-images.txt
      - tests/get-avml.sh
      - .github/workflows/distros.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distributions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guest:
    strategy:
      fail-fast: false
      matrix:
        name:
          - debian-13
          - debian-12
          - ubuntu-2604
          - ubuntu-2404
          - fedora-45
          - almalinux-10
          - almalinux-9
          - rocky-10
          - opensuse-leap-16
          - arch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl and QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xorriso musl-tools qemu-system-x86 qemu-utils
      - name: KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; else echo "no /dev/kvm, the guest is emulated"; fi
      - name: Build keep, the program of its unit checks and the scanner alone
        run: make all tests/keyscan
      - name: Fetch AVML by its pinned SHA-256
        run: tests/get-avml.sh "$RUNNER_TEMP/avml"
      - name: compat-check.sh in the guest
        run: |
          mkdir -p "$RUNNER_TEMP/work"
          AVML="$RUNNER_TEMP/avml" tests/compat-guest.sh -m "$RUNNER_TEMP/work" "${{ matrix.name }}" | tee "$RUNNER_TEMP/compat.txt"
          grep -q '^RESULT: PASS$' "$RUNNER_TEMP/compat.txt"
      - name: The console of the guest, after a failure
        if: failure()
        run: tail -n 150 "$RUNNER_TEMP/work/guest/${{ matrix.name }}/console.log" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: guest-${{ matrix.name }}
          path: ${{ runner.temp }}/compat.txt
          retention-days: 30
