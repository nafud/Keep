# The checks of Keep on every push and pull request.
#
#   selftest   tests/selftest.sh -a: the static checks, the scanner on fixtures and the verifier
#              on LUKS headers made by cryptsetup, on disks of virtual machines and on EnCase
#              images.
#              tests/unit-check.sh -a: the parts of keep, each against an independent source,
#              in a static build and in one with the sanitizers of the compiler
#   pages      tests/pages-check.sh: the pages of Keep build with MkDocs from the packages that
#              requirements.txt pins, and what is built loads nothing from another host
#   build      make: keep builds static against musl with the warnings as errors. The file
#              and its SHA-256 are kept as an artifact
#   compat     tests/compat-check.sh as root on two runner images: keep on real device-mapper,
#              a real /proc/kcore and real mounts, held against the cryptsetup and the dmsetup
#              of the runner, with memory images that are held against the image of AVML, which
#              is in LiME format on one runner and compressed on the other
#
# A green compat job is a statement about the kernel and the cryptsetup of that runner image and
# about nothing else. Its first step prints both.
#
# Actions are pinned by commit, and .github/dependabot.yml proposes their updates.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck, cryptsetup, qemu-img, ewfacquirestream and musl
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends shellcheck cryptsetup-bin qemu-utils ewf-tools musl-tools
      - name: Versions
        run: |
          bash --version | head -n 1
          gcc --version | head -n 1
          python3 --version
          shellcheck --version | sed -n '2p'
          cryptsetup --version
      - name: Self-test
        run: tests/selftest.sh -a
      # The compressed memory image of keep is given to AVML itself, which converts it.
      - name: Fetch AVML by its pinned SHA-256
        run: tests/get-avml.sh "$RUNNER_TEMP/avml"
      - name: The parts of keep
        run: AVML="$RUNNER_TEMP/avml" tests/unit-check.sh -a

  pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MkDocs by its pinned hashes
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/pages"
          "$RUNNER_TEMP/pages/bin/pip" install --quiet --require-hashes -r requirements.txt
      - name: Build the pages and read them
        run: MKDOCS="$RUNNER_TEMP/pages/bin/mkdocs" tests/pages-check.sh

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools
          musl-gcc --version | head -n 1
          dpkg-query -W -f='musl-dev ${Version}\n' musl-dev
      - name: Build keep
        run: make keep
      - name: The file is static, names its version and refuses a wrong option
        run: |
          file keep | tee /dev/stderr | grep -q 'statically linked\|static-pie linked'
          ./keep -V
          ./keep -h > /dev/null
          rc=0; ./keep -Z 2> /dev/null || rc=$?; [ "$rc" = 2 ]
          sha256sum keep | tee keep.sha256
      # The program as this commit builds it, with its SHA-256. It is linked against musl
      # alone, whose licence lets the file be passed on as it is.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keep
          path: |
            keep
            keep.sha256
          if-no-files-found: error
          retention-days: 30

  # keep itself, on the device-mapper and the /proc/kcore of the runner: encrypted containers
  # with known keys, as on a throwaway guest. The first step records what the runner offers,
  # because the check can only say something about the kernel and the cryptsetup it met.
  compat:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            image: -c       # AVML: the compressed memory image
            formats: raw avml   # keep: the raw image, then the compressed one
          - os: ubuntu-22.04
            image: -m       # AVML: the memory image in LiME format
            formats: lime   # keep: the same format
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl, cryptsetup, dmsetup, the tools of FAT and LVM
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends musl-tools cryptsetup-bin dmsetup dosfstools lvm2
      - name: What the runner offers
        run: |
          uname -r
          cat /sys/kernel/security/lockdown || echo "no lockdown file"
          grep MemTotal /proc/meminfo
          sudo modprobe dm-crypt || echo "modprobe dm-crypt failed"
          sudo dmsetup version || echo "dmsetup cannot reach device-mapper"
          sudo dmsetup targets || true
          sudo ls -l /proc/kcore || echo "no /proc/kcore"
          df -h / "$RUNNER_TEMP"
      # keep, the program of its unit checks and the scanner alone, static, and keep once more
      # with the address and undefined-behaviour sanitizers, which compat-check.sh runs at the
      # same places as the static one
      - name: Build keep, also with the sanitizers
        run: make all tests/keyscan keep-san
      - name: Fetch AVML by its pinned SHA-256
        run: tests/get-avml.sh "$RUNNER_TEMP/avml"
      - name: compat-check.sh
        run: |
          sudo KEEP_SAN="$PWD/keep-san" KEEP_IMAGES="${{ matrix.formats }}" AVML="$RUNNER_TEMP/avml" bash tests/compat-check.sh ${{ matrix.image }} | tee "$RUNNER_TEMP/compat.txt"
          grep -q '^RESULT: PASS$' "$RUNNER_TEMP/compat.txt"
          # on these runners no part may be skipped
          ! grep '^SKIP' "$RUNNER_TEMP/compat.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compat-${{ matrix.os }}
          path: ${{ runner.temp }}/compat.txt
          retention-days: 30
