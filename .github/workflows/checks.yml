# The checks of Keep on every push and pull request.
#
#   selftest   tests/selftest.sh -a: the static checks, the scanner on fixtures, the verifier and
#              the on-scene proof on LUKS headers made by cryptsetup, keytriage.sh on stand-ins
#              for the examined system, the menu through a pipe.
#              tests/unit-check.sh -a: the parts of the C program, each against an independent
#              source, in a static build and in one with the sanitizers of the compiler
#   medium     build-toolkit.sh: the scene tool medium builds, its manifest verifies and its own
#              static shell runs its scripts
#   compat     tests/compat-check.sh as root on two runner images: keytriage.sh from the medium on
#              real device-mapper, a real /proc/kcore and real mounts, with a memory image, in
#              LiME format on one image and compressed on the other, and the C program beside
#              it, which must give the same verdicts, header backups and keys
#
# A green compat job is a statement about the kernel and the cryptsetup of that runner image and
# about nothing else. Its first step prints both.
#
# Actions are pinned by commit, and .github/dependabot.yml proposes their updates.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck, cryptsetup and the shell and applets of the medium
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends shellcheck cryptsetup-bin bash-static busybox-static qemu-utils ewf-tools musl-tools
      - name: Versions
        run: |
          bash --version | head -n 1
          gcc --version | head -n 1
          python3 --version
          shellcheck --version | sed -n '2p'
          cryptsetup --version
      - name: Self-test
        run: tests/selftest.sh -a
      - name: The parts of the C program
        run: tests/unit-check.sh -a

  medium:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the parts of the medium
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bash-static busybox-static xorriso musl-tools
      - name: Build the medium
        run: ./build-toolkit.sh "$RUNNER_TEMP/work"
      - name: The manifest verifies and the medium's shell runs its scripts
        run: |
          cd "$RUNNER_TEMP/work/tools"
          sha256sum -c --quiet MANIFEST.sha256
          env -i ./bin/bash -p ./keytriage.sh -h > /dev/null
          printf 'system\n%s\n\n\nyes\n' "$RUNNER_TEMP" | env -i ./keep -n | tee "$RUNNER_TEMP/menu.txt"
          grep -q 'dry run, nothing was run' "$RUNNER_TEMP/menu.txt"
          cat VERSIONS.txt
      # The record of what was built. The ISO itself is not uploaded: it carries the bash and
      # busybox binaries, and passing those on needs their source offered with them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: medium-record
          path: |
            ${{ runner.temp }}/work/tools/VERSIONS.txt
            ${{ runner.temp }}/work/tools/MANIFEST.sha256
            ${{ runner.temp }}/work/tools.iso.sha256
          if-no-files-found: error
          retention-days: 30

  # keytriage.sh itself, on the device-mapper and the /proc/kcore of the runner: two encrypted
  # containers with known keys, as on a throwaway guest. The first step records what the runner
  # offers, because the check can only say something about the kernel and the cryptsetup it met.
  compat:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            image: -c       # the compressed memory image
          - os: ubuntu-22.04
            image: -m       # the memory image in LiME format
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the parts of the medium, cryptsetup and dmsetup
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bash-static busybox-static xorriso musl-tools cryptsetup-bin dmsetup dosfstools lvm2
      - name: What the runner offers
        run: |
          uname -r
          bash-static --version | head -n 1
          cat /sys/kernel/security/lockdown || echo "no lockdown file"
          grep MemTotal /proc/meminfo
          sudo modprobe dm-crypt || echo "modprobe dm-crypt failed"
          sudo dmsetup version || echo "dmsetup cannot reach device-mapper"
          sudo dmsetup targets || true
          sudo ls -l /proc/kcore || echo "no /proc/kcore"
          df -h / "$RUNNER_TEMP"
      - name: Build the medium
        run: ./build-toolkit.sh "$RUNNER_TEMP/work"
      # the C program once more with the address and undefined-behaviour sanitizers, which
      # compat-check.sh runs at the same places as the static one
      - name: Build the C program with the sanitizers
        run: make keep-san
      - name: compat-check.sh
        run: |
          sudo KEEP_SAN="$PWD/keep-san" bash tests/compat-check.sh ${{ matrix.image }} "$RUNNER_TEMP/work/tools" | tee "$RUNNER_TEMP/compat.txt"
          grep -q '^RESULT: PASS$' "$RUNNER_TEMP/compat.txt"
          # on these runners no part may be skipped
          ! grep '^SKIP' "$RUNNER_TEMP/compat.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compat-${{ matrix.os }}
          path: ${{ runner.temp }}/compat.txt
          retention-days: 30
