# Temporary: the checksum files of the cloud images that are to be pinned.
name: probe
on:
  push:
    branches: ['claude/**']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checksum files
        run: |
          text() { echo "#### $1"; curl -s -L --max-time 40 "$1" | grep -v -E 'arm64|aarch64|ppc64|s390x|riscv|\.raw|\.json|\.tar' | head -n "${2:-12}"; echo; }
          text https://cloud.debian.org/images/cloud/trixie/20261116-2664/SHA512SUMS
          text https://cloud.debian.org/images/cloud/bookworm/20261117-2665/SHA512SUMS
          text https://cloud.centos.org/centos/10-stream/x86_64/images/CentOS-Stream-GenericCloud-10-20261118.0.x86_64.qcow2.SHA256SUM
          text https://download.opensuse.org/distribution/leap/16.1/appliances/Leap-16.1-Minimal-VM.x86_64-Cloud-Build3.21.qcow2.sha256
          text https://download.opensuse.org/distribution/leap/15.6/appliances/openSUSE-Leap-15.6-Minimal-VM.x86_64-15.6.0-Cloud-Build19.146.qcow2.sha256
          text https://geo.mirror.pkgbuild.com/images/v20261115.625457/Arch-Linux-x86_64-cloudimg-20261115.625457.qcow2.SHA256
          for u in https://cloud.debian.org/images/cloud/trixie/20261116-2664/debian-13-generic-amd64-20261116-2664.qcow2 \
                   https://cloud.debian.org/images/cloud/bookworm/20261117-2665/debian-12-generic-amd64-20261117-2665.qcow2 \
                   https://cloud.centos.org/centos/10-stream/x86_64/images/CentOS-Stream-GenericCloud-10-20261118.0.x86_64.qcow2 \
                   https://download.opensuse.org/distribution/leap/16.1/appliances/Leap-16.1-Minimal-VM.x86_64-Cloud-Build3.21.qcow2 \
                   https://geo.mirror.pkgbuild.com/images/v20261115.625457/Arch-Linux-x86_64-cloudimg-20261115.625457.qcow2 \
                   https://dl.fedoraproject.org/pub/fedora/linux/releases/45/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-45-1.4.x86_64.qcow2 \
                   https://repo.almalinux.org/almalinux/10/cloud/x86_64/images/AlmaLinux-10-GenericCloud-10.3-20261116.0.x86_64.qcow2 \
                   https://repo.almalinux.org/almalinux/9/cloud/x86_64/images/AlmaLinux-9-GenericCloud-9.9-20261116.x86_64.qcow2 \
                   https://dl.rockylinux.org/pub/rocky/10/images/x86_64/Rocky-10-GenericCloud-Base-10.3-20261112.0.x86_64.qcow2; do
            echo "#### $u"; curl -s -I -L --max-time 40 "$u" | grep -i -E '^HTTP|^content-length|^location' | tr -d '\r' | tr '\n' ' '; echo
          done
